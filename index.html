/* ---------- ランキング ---------- */
function usedRounds(s){ var rc=s.roundCount||s.rounds.length; return s.rounds.slice(0,rc).filter(function(r,i){ return i===0||roundStats(r).shot>0; }); }
function flattenRounds(history){ var rows=[];
  history.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(s){
    usedRounds(s).forEach(function(r){ var st=roundStats(r); if(st.shot===0)return; rows.push({date:s.date,distance:r.distance,total:st.total,avg:st.total/st.shot}); }); });
  return rows;
}
function myMonthlyBests(month){ var best={};
  state.history.forEach(function(s){ if((s.date||"").slice(0,7)!==month)return;
    usedRounds(s).forEach(function(r){ var st=roundStats(r); if(st.shot!==36)return; if(best[r.distance]==null||st.total>best[r.distance])best[r.distance]=st.total; }); });
  return best;
}
function allTimeBests(){ var best={};
  state.history.forEach(function(s){ usedRounds(s).forEach(function(r){ var st=roundStats(r); if(st.shot!==36)return;
    if(best[r.distance]==null||st.total>best[r.distance])best[r.distance]=st.total; }); });
  return best;
}
/* 1回の記録内で「同じ距離・36射」のラウンドが2本以上あれば、その上位2本の合計を72射スコアとする */
function record72byDist(s){ var byd={};
  usedRounds(s).forEach(function(r){ var st=roundStats(r); if(st.shot!==36)return; (byd[r.distance]=byd[r.distance]||[]).push(st.total); });
  var out={}; Object.keys(byd).forEach(function(d){ var arr=byd[d].sort(function(a,b){return b-a;}); if(arr.length>=2)out[d]=arr[0]+arr[1]; });
  return out;
}
function myMonthlyBests72(month){ var best={};
  state.history.forEach(function(s){ if((s.date||"").slice(0,7)!==month)return;
    var r72=record72byDist(s); Object.keys(r72).forEach(function(d){ if(best[d]==null||r72[d]>best[d])best[d]=r72[d]; }); });
  return best;
}
function weekScoresSummary(weekMonday){ var end=addDaysStr(weekMonday,6),byd={},n=0;
  state.history.forEach(function(s){ if(!s.date||s.date<weekMonday||s.date>end)return; var counted=false;
    usedRounds(s).forEach(function(r){ var st=roundStats(r); if(st.shot!==36)return; counted=true;
      if(byd[r.distance]==null||st.total>byd[r.distance])byd[r.distance]=st.total; });
    if(counted)n++; });
  return {n:n,byd:byd};
}
function publishMonth(month,cb){
  if(!DB.ready()||!state.playerName){ if(cb)cb(); return; }
  var bests=myMonthlyBests(month), b72=myMonthlyBests72(month);
  var rows=Object.keys(bests).map(function(d){ return {player_id:state.playerId,name:state.playerName,distance:Number(d),month:month,score:bests[d]}; });
  var rows72=Object.keys(b72).map(function(d){ return {player_id:state.playerId,name:state.playerName,distance:Number(d),month:month,score:b72[d]}; });
  var tasks=[];
  if(rows.length)tasks.push(DB.upsert(rows));
  if(rows72.length)tasks.push(DB.upsert72(rows72));
  if(!tasks.length){ if(cb)cb(); return; }
  Promise.all(tasks).then(function(){ if(cb)cb(); }).catch(function(err){ if(cb)cb({error:{message:(err&&err.message)||"通信エラー"}}); });
}
function loadRanking(){
  if(!DB.ready()){ render(); return; }
  state.rankLoading=true; state.rankErr=""; render();
  var p=state.rankArrows===72?DB.select72(state.rankMonth,state.rankDistance):DB.select(state.rankMonth,state.rankDistance);
  p.then(function(data){ state.rankLoading=false; state.rankRows=data||[]; render(); })
    .catch(function(err){ state.rankLoading=false; state.rankErr=(err&&err.message)||"通信エラー"; state.rankRows=[]; render(); });
}
function registerMember(){ if(!DB.ready()||!state.playerName)return; DB.memberUpsert({player_id:state.playerId,name:state.playerName}).then(function(){ state.members=null; }).catch(function(){}); }
function loadMembers(){ if(!DB.ready())return; DB.membersAll().then(function(d){ state.members=d||[]; render(); }).catch(function(){ if(state.members==null)state.members=[]; }); }
function loadFFEntrants(week){ if(!DB.ready())return; DB.ffByWeek(week).then(function(d){
    var pids={}; (d||[]).forEach(function(x){ if((x.goal&&x.goal.trim())||(x.reflection&&x.reflection.trim()))pids[x.player_id]=1; });
    state.ffEntrants={week:week,pids:pids}; render(); }).catch(function(){}); }
function notEnteredNames(enteredPidSet){ return (state.members||[]).filter(function(m){ return !enteredPidSet[m.player_id]; }).map(function(m){ return m.name; }); }

function adoptByCode(code){
  code=(code||"").trim(); if(!code){ alert("引き継ぎコードを入力してね。"); return; }
  if(!DB.ready()){ alert("通信できません。少し待って試してね。"); return; }

    if(list&&list.length){

      state.playerName=list[0].name; try{localStorage.setItem("archery_pname",state.playerName);}catch(x){}

      registerMember(); alert("「"+state.playerName+"」として引き継ぎました。");
      publishMonth(state.rankMonth,function(){ render(); });

  }).catch(function(err){ alert("エラー：\n"+((err&&err.message)||"通信エラー")); });
}

  round.ends.forEach(function(end,ei){
    h+='<div class="grid" style="grid-template-columns:'+cols+';margin-top:4px"><div class="en">'+(ei+1)+'</div>';
    end.forEach(function(a,ai){ var c=colorOf(a); var on=(active.end===ei&&active.arrow===ai)?" on":"";
      var st=c?('background:'+c.bg+';color:'+c.fg+';border-color:'+c.line):"";
      h+='<button class="cell'+on+'" style="'+st+'" data-action="selectcell" data-end="'+ei+'" data-arrow="'+ai+'">'+(a==null?"·":a)+'</button>'; });
    var has=end.some(function(x){return x!=null;});
    h+='<div class="sum">'+(has?stats.endTotals[ei]:"")+'</div><div class="cum">'+(has?stats.cumulative[ei]:"")+'</div></div>';
  });

function chartSVG(rows,metric){
  if(!rows.length)return '';
  var W=320,H=200,padL=30,padR=10,padT=10,padB=26,plotW=W-padL-padR,plotH=H-padT-padB,yMax=metric==="total"?360:10,n=rows.length;
  var xAt=function(i){return n===1?padL+plotW/2:padL+(i/(n-1))*plotW;}, yAt=function(v){return padT+plotH-(v/yMax)*plotH;};
  var dists=[]; rows.forEach(function(r){ if(dists.indexOf(r.distance)<0)dists.push(r.distance); }); dists.sort(function(a,b){return a-b;});
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  [0,yMax/2,yMax].forEach(function(v){ var y=yAt(v);
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eee"/><text x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="8" fill="#8a8a90">'+Math.round(v)+'</text>'; });
  dists.forEach(function(d){ var pts=[];
    rows.forEach(function(r,i){ if(r.distance===d){ var v=metric==="total"?r.total:r.avg; pts.push([xAt(i),yAt(v)]); } });
    if(pts.length){ var col=DIST_COLOR[d]||"#888"; var pl=pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
      svg+='<polyline points="'+pl+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
      pts.forEach(function(p){ svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="'+col+'"/>'; }); }
  });
  var step=Math.ceil(n/8);
  rows.forEach(function(r,i){ if(i%step===0||i===n-1) svg+='<text x="'+xAt(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="8" fill="#8a8a90">'+shortDate(r.date)+'</text>'; });
  svg+='</svg><div class="legend">';
  dists.forEach(function(d){ svg+='<span class="lg"><span class="sw" style="background:'+(DIST_COLOR[d]||"#888")+'"></span>'+d+'m</span>'; });
  return svg+'</div>';
}

function ffEntryCard(e,showName,mine,targetPid,reactions){
  var h='<div class="ffcard" style="background:#fff;border:1px solid #d3d0c8"><div class="ffhead">'+(showName?('<b>'+escapeHtml(e.name)+'</b> ・ '):'')+ffWeekLabel(e.week)+'の週'
    +(e.category?(' <span class="catchip on" style="cursor:default;margin-left:6px">'+escapeHtml(e.category)+'</span>'):'')+'</div>';
  if(e.goal) h+='<div class="ffrow"><span class="fftag">目標</span><span>'+escapeHtml(e.goal)+'</span></div>';
  if(e.reflection) h+='<div class="ffrow"><span class="fftag rf">ふり返り</span><span>'+escapeHtml(e.reflection)+'</span></div>';
  if(mine){ var ws=weekScoresSummary(e.week); if(ws.n){ var parts=[]; DISTANCES.forEach(function(d){ if(ws.byd[d]!=null)parts.push(d+'m '+ws.byd[d]); });
    h+='<div class="ffrow"><span class="fftag" style="color:#2f6f95;background:#e8f1f7">スコア</span><span>この週 '+ws.n+'回'+(parts.length?('・ベスト '+parts.join(' / ')):'')+'</span></div>'; } }
  if(mine) h+='<button class="ffopenbtn" data-action="ffopen" data-week="'+e.week+'">この週を編集</button>';
  if(targetPid) h+=reactionsBlock(targetPid,e.week,reactions);
  return h+'</div>';
}
function groupReactions(rows){ var m={}; (rows||[]).forEach(function(x){ (m[x.week]=m[x.week]||[]).push(x); }); return m; }
function reactionsBlock(targetPid,week,reactions){
  var list=(reactions&&reactions[week])||[];
  var EMO=["👍","🔥","👏","💪"],counts={},mineSet={};
  list.forEach(function(x){ if(x.emoji){ counts[x.emoji]=(counts[x.emoji]||0)+1; if(x.from_pid===state.playerId)mineSet[x.emoji]=1; } });
  var h='<div class="rxbar">';
  EMO.forEach(function(em){ var c=counts[em]||0; h+='<button class="rxbtn'+(mineSet[em]?" mine":"")+'" data-action="ffstamp" data-pid="'+escapeHtml(targetPid)+'" data-week="'+week+'" data-emoji="'+em+'">'+em+(c?(' '+c):'')+'</button>'; });
  h+='<button class="rxbtn" data-action="ffcomment" data-pid="'+escapeHtml(targetPid)+'" data-week="'+week+'">💬 コメント</button></div>';
  list.forEach(function(x){ if(x.comment){ h+='<div class="rxcomment"><b>'+escapeHtml(x.from_name)+'</b>：'+escapeHtml(x.comment)+'</div>'; } });
  return h;
}
function prefillFFWeek(){
  var e=(state.ffMine||[]).filter(function(x){return x.week===state.ffWeek;})[0];
  state.ffGoal=e?(e.goal||""):""; state.ffReflection=e?(e.reflection||""):""; state.ffCategory=e?(e.category||""):"";
}
function loadFFMine(){
  if(!DB.ready()){ render(); return; }
  state.ffMineLoading=true; state.ffMineErr=""; render();
  if(state.members==null)loadMembers(); loadFFEntrants(state.ffWeek);
  DB.ffMine(state.playerId).then(function(data){ state.ffMineLoading=false; state.ffMine=data||[]; prefillFFWeek(); render();
    DB.ffReactions(state.playerId).then(function(rx){ state.ffMineReactions=groupReactions(rx); render(); }).catch(function(){}); })
    .catch(function(err){ state.ffMineLoading=false; state.ffMineErr=(err&&err.message)||"通信エラー"; state.ffMine=[]; render(); });
}
function reloadReactions(pid){
  DB.ffReactions(pid).then(function(rx){ var g=groupReactions(rx);
    if(pid===state.playerId){ state.ffMineReactions=g; }
    if(state.ffPerson&&state.ffPerson.pid===pid){ state.ffPersonReactions=g; }
    render(); }).catch(function(){});
}
function loadFFSearch(){
  if(!DB.ready()){ render(); return; }
  state.ffPerson=null;
  state.ffSearchLoading=true; state.ffSearchErr=""; state.ffSearched=true; render();
  var q=(state.ffQuery||"").trim();
  var p=q?DB.ffSearch(q):DB.ffRecent();
  p.then(function(data){ state.ffSearchLoading=false; state.ffResults=data||[]; render(); })
   .catch(function(err){ state.ffSearchLoading=false; state.ffSearchErr=(err&&err.message)||"通信エラー"; state.ffResults=[]; render(); });
}

/* ---------- FF：人ごとに集約 ---------- */
function aggregateLatest(rows){
  var map={},order=[];
  (rows||[]).forEach(function(r){ var k=r.player_id;
    if(!map[k]){ map[k]={name:r.name,player_id:k,week:r.week,goal:r.goal,reflection:r.reflection}; order.push(k); }
    else if(r.week>map[k].week){ map[k].week=r.week; map[k].goal=r.goal; map[k].reflection=r.reflection; } });
  return order.map(function(k){ return map[k]; });
}
function ffPersonCard(e){
  var h='<div class="ffcard tapcard" style="background:#fff;border:1px solid #d3d0c8" data-action="ffperson" data-pid="'+escapeHtml(e.player_id)+'" data-name="'+escapeHtml(e.name)+'">';

  if(e.goal) h+='<div class="ffrow"><span class="fftag">目標</span><span>'+escapeHtml(e.goal)+'</span></div>';
  if(e.reflection) h+='<div class="ffrow"><span class="fftag rf">ふり返り</span><span>'+escapeHtml(e.reflection)+'</span></div>';
  h+='<div class="cnote" style="color:#1c6a94;padding-top:6px">タップで '+escapeHtml(e.name)+' さんの記録をすべて見る</div>';
  return h+'</div>';
}

}
function bottomNav(active){
  var items=[["home","記録","🎯"],["ranking","ランキング","🏆"],["ff","週目標","✍️"],["settings","設定","⚙️"]];
  var h='<div class="bnav">';
  items.forEach(function(it){ var on=active===it[0]?" on":"";
    h+='<button class="bnav-item'+on+'" data-action="tab" data-view="'+it[0]+'">'
      +'<span class="bnav-ic">'+it[2]+'</span><span class="bnav-lb">'+it[1]+'</span></button>'; });
  return h+'</div>';
}
function render(){
  var y=window.scrollY,h="";
  if(!state.playerName){ h=onboardingView(); }
  else if(state.screen==="settings"){ h=topHeader("設定")+settingsView()+bottomNav("settings"); }
  else if(state.screen==="home"){ h=topHeader("記録")+homeView()+bottomNav("home"); }
  else if(state.screen==="ranking"){ h=topHeader("ランキング")+rankingView()+bottomNav("ranking"); }
  else if(state.screen==="ff"){ h=topHeader("週目標")+ffView()+bottomNav("ff"); }
  else if(state.screen==="pickdist"){ h=pickDistView(); }
  else if(state.screen==="input"){ h=inputView(); if(state.sheet)h+=sheetView(); }
  document.getElementById("app").innerHTML=h;
  window.scrollTo(0,y);
}
function rerender(){ persistFlow(); render(); }

/* ---------- フロー操作 ---------- */
function startAdd(){ state.session={id:String(Date.now()),date:todayStr(),roundCount:1,rounds:[],kind:"練習",note:""}; state.creating=true; state.pickForRound=0; state.activeRound=0; state.active={end:0,arrow:0}; state.sheet=null; state.screen="pickdist"; window.scrollTo(0,0); rerender(); }
function finishRecord(){
  var s=state.session; if(!s){ state.screen="home"; rerender(); return; }
  var shot=0; s.rounds.forEach(function(r){ shot+=roundStats(r).shot; });
  if(shot>0){
    var prevPB=allTimeBests(), pbHit=null;
    usedRounds(s).forEach(function(r){ var st=roundStats(r); if(st.shot!==36)return;
      if(prevPB[r.distance]==null||st.total>prevPB[r.distance]){ if(!pbHit||st.total>pbHit.score)pbHit={distance:r.distance,score:st.total}; } });
    s.roundCount=s.rounds.length; var id=s.id;
    state.history=[clone(s)].concat(state.history.filter(function(h){return h.id!==id;}));
    saveHistory();
    state.pbMsg = pbHit ? ("自己ベスト更新！ "+pbHit.distance+"m "+pbHit.score+"点") : "";
    var m=(s.date||"").slice(0,7);
    if(DB.ready()&&state.playerName){ publishMonth(m,function(){}); }
  }
  state.session=null; state.sheet=null; state.creating=false; state.screen="home"; window.scrollTo(0,0); rerender();
}

/* ---------- イベント ---------- */
var app=document.getElementById("app");
app.addEventListener("change",function(e){ var t=e.target; if(!t.dataset)return; var a=t.dataset.action;
  if(a==="setdate"){ state.session.date=t.value; persistFlow(); }
  else if(a==="setnote"){ if(state.session){ state.session.note=t.value; persistFlow(); } }
  else if(a==="setimport"){ state.importText=t.value; }
  else if(a==="setname"){ state.playerName=(t.value||"").trim(); try{localStorage.setItem("archery_pname",state.playerName);}catch(x){}
    publishMonth(state.rankMonth,function(){ if(state.screen==="ff"){ loadFFMine(); } else if(state.screen==="ranking"){ loadRanking(); } else { render(); } }); }
  else if(a==="ffgoal"){ state.ffGoal=t.value; }
  else if(a==="ffreflect"){ state.ffReflection=t.value; }
  else if(a==="ffquery"){ state.ffQuery=t.value; }
  else if(a==="rankmonth"){ state.rankMonth=t.value; loadRanking(); }
});
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-action]"); if(!t)return; var a=t.dataset.action;

  if(a==="tab"){ state.screen=t.dataset.view; window.scrollTo(0,0);
    if(state.screen==="settings"){ state.nameSaved=false; render(); }
    else if(state.screen==="ranking"&&DB.ready()){ if(state.members==null)loadMembers(); loadRanking(); }
    else if(state.screen==="ff"&&DB.ready()){ loadFFMine(); if(state.ffTab==="search"&&state.ffResults===null){ loadFFSearch(); } }
    else { render(); } return; }
  if(a==="metric"){ state.metric=t.dataset.metric; render(); return; }
  if(a==="add"){ startAdd(); return; }
  if(a==="pbdismiss"){ state.pbMsg=""; render(); return; }
  if(a==="setkind"){ if(state.session){ state.session.kind=t.dataset.kind; rerender(); } return; }
  if(a==="rankarrows"){ state.rankArrows=+t.dataset.arrows; loadRanking(); return; }
  if(a==="copyexport"){ var txt=exportJSON();
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ alert("コピーしました。メモやLINEに保存しておいてね。"); },function(){ var el=document.getElementById("exportbox"); if(el){el.focus();el.select();} alert("長押しで全選択してコピーしてね。"); }); }
    else { var el2=document.getElementById("exportbox"); if(el2){el2.focus();el2.select();} alert("長押しで全選択してコピーしてね。"); } return; }
  if(a==="importdata"){ var raw=(state.importText||"").trim(); if(!raw){ alert("バックアップの文字を貼り付けてね。"); return; }
    var data; try{ data=JSON.parse(raw); }catch(err){ alert("読み込めませんでした。文字が全部そろっているか確認してね。"); return; }
    var inc=(data&&data.history)||[]; if(!inc.length){ alert("記録が見つかりませんでした。"); return; }
    var byId={}; state.history.forEach(function(h){byId[h.id]=h;}); inc.forEach(function(h){ if(h&&h.id)byId[h.id]=h; });
    state.history=Object.keys(byId).map(function(k){return byId[k];}); saveHistory();
    if(!state.playerName&&data.name){ state.playerName=data.name; try{localStorage.setItem("archery_pname",data.name);}catch(x){} }
    state.importText=""; alert(inc.length+"件を読み込みました。合計 "+state.history.length+"件になりました。");
    publishMonth(state.rankMonth,function(){ render(); }); return; }

  if(a==="startapp"){ var obn=document.getElementById("obname"); var nm=(obn?obn.value:"").trim();
    if(!nm){ alert("名前を入れてね。"); return; }
    state.pendingName=nm; createNewAccount(); return; }
  if(a==="adoptcode"){ var oc=document.getElementById("obcode"); adoptByCode(oc?oc.value:""); return; }
  if(a==="switchcode"){ var sc=document.getElementById("switchcode"); var v=(sc?sc.value:"").trim();
    if(!v){ alert("引き継ぎコードを入力してね。"); return; }
    if(v===state.playerId){ alert("これは今の端末のコードです。"); return; }
    if(confirm("この端末を、入力したコードのアカウントに切り替えます。今の表示は置き換わります。よろしいですか？")) adoptByCode(v); return; }
  if(a==="copycode"){ var cc=state.playerId;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(cc).then(function(){ alert("コードをコピーしました。安全な場所に保存してね。"); },function(){ var el=document.getElementById("mycode"); if(el){el.focus();el.select();} alert("長押しで全選択してコピーしてね。"); }); }
    else { var el2=document.getElementById("mycode"); if(el2){el2.focus();el2.select();} alert("長押しで全選択してコピーしてね。"); } return; }
  if(a==="resetlocal"){ if(!confirm("この端末の記録・名前・IDを消して最初からやり直します。よろしいですか？（サーバー上のデータは消えません）")) return;
    try{ localStorage.removeItem("archery_history_v1"); localStorage.removeItem("archery_pname"); localStorage.removeItem("archery_pid"); localStorage.removeItem("archery_flow_v2"); }catch(x){}
    location.reload(); return; }
  if(a==="savename"){ var sni=document.getElementById("setname_input"); var nm2=(sni?sni.value:"").trim();
    if(!nm2){ alert("名前を入れてね。"); return; }
    state.playerName=nm2; try{localStorage.setItem("archery_pname",nm2);}catch(x){}
    registerMember();
    state.nameSaved=true; publishMonth(state.rankMonth,function(){ render(); }); return; }

  if(a==="pickdist"){ var d=+t.dataset.dist,idx=state.pickForRound;
    if(state.session.rounds[idx]){ state.session.rounds[idx].distance=d; } else { state.session.rounds[idx]=emptyRound(d); }
    state.activeRound=idx; state.active=firstEmpty(state.session.rounds[idx]); state.sheet=null; state.screen="input"; window.scrollTo(0,0); rerender(); return; }
  if(a==="pickback"){ var i2=state.pickForRound, exists=state.session&&state.session.rounds[i2];
    if(!exists){ if(i2===0){ state.session=null; state.creating=false; state.screen="home"; } else { state.screen="input"; state.activeRound=0; state.sheet="afterR1"; } }
    else { state.screen="input"; state.activeRound=i2; state.sheet=null; }
    window.scrollTo(0,0); rerender(); return; }

  if(a==="redist"){ state.pickForRound=state.activeRound; state.screen="pickdist"; window.scrollTo(0,0); rerender(); return; }
  if(a==="cancelinput"){ var sh=0; state.session.rounds.forEach(function(r){ sh+=roundStats(r).shot; });
    if(sh>0 && !confirm("入力中の記録を破棄して戻りますか？（保存されません）"))return;
    state.session=null; state.sheet=null; state.creating=false; state.screen="home"; window.scrollTo(0,0); rerender(); return; }
  if(a==="finishexit"){ finishRecord(); return; }

  if(a==="selectcell"){ state.active={end:+t.dataset.end,arrow:+t.dataset.arrow}; rerender(); return; }
  if(a==="score"){ var round=state.session.rounds[state.activeRound];
    var wasFull=round.ends.every(function(en){return en.every(function(x){return x!=null;});});
    var sc=t.dataset.score,en=state.active.end,ar=state.active.arrow; round.ends[en][ar]=sc;
    if(ar<5){ar++;} else if(en<5){en++;ar=0;} state.active={end:en,arrow:ar};
    var isFull=round.ends.every(function(e2){return e2.every(function(x){return x!=null;});});
    if(!wasFull&&isFull){ state.sheet=(state.activeRound===0&&state.session.rounds.length<2)?"afterR1":"afterLast"; }
    rerender(); return; }
  if(a==="back"){ var e3=state.active.end,a3=state.active.arrow; if(a3>0){a3--;} else if(e3>0){e3--;a3=5;}
    state.session.rounds[state.activeRound].ends[e3][a3]=null; state.active={end:e3,arrow:a3}; rerender(); return; }
  if(a==="clearcell"){ state.session.rounds[state.activeRound].ends[state.active.end][state.active.arrow]=null; rerender(); return; }

  if(a==="sheetround2"){ state.pickForRound=1; state.sheet=null; state.screen="pickdist"; window.scrollTo(0,0); rerender(); return; }
  if(a==="sheetfinish"){ finishRecord(); return; }
  if(a==="sheetclose"){ state.sheet=null; rerender(); return; }

  if(a==="open"){ var f=state.history.filter(function(h){return h.id===t.dataset.id;})[0];
    if(f){ state.session=clone(f); state.creating=false; state.activeRound=0; state.active=firstEmpty(state.session.rounds[0]); state.sheet=null; state.screen="input"; window.scrollTo(0,0); rerender(); } return; }
  if(a==="delete"){ if(confirm("この記録を削除します。よろしいですか？")){ state.history=state.history.filter(function(h){return h.id!==t.dataset.id;}); saveHistory(); render(); } return; }

  if(a==="rankdist"){ state.rankDistance=+t.dataset.dist; loadRanking(); return; }
  if(a==="rankrefresh"){ loadRanking(); return; }
  if(a==="fftab"){ state.ffTab=t.dataset.fftab; state.ffPerson=null; if(state.ffTab==="search"&&state.ffResults===null){ loadFFSearch(); } else { render(); } return; }
  if(a==="ffprev"){ state.ffWeek=addDaysStr(state.ffWeek,-7); state.ffSaved=false; prefillFFWeek(); loadFFEntrants(state.ffWeek); render(); return; }
  if(a==="ffnext"){ state.ffWeek=addDaysStr(state.ffWeek,7); state.ffSaved=false; prefillFFWeek(); loadFFEntrants(state.ffWeek); render(); return; }
  if(a==="ffopen"){ state.ffWeek=t.dataset.week; state.ffSaved=false; state.ffTab="mine"; prefillFFWeek(); loadFFEntrants(state.ffWeek); window.scrollTo(0,0); render(); return; }
  if(a==="ffsearchbtn"){ var qi=document.querySelector('[data-action=ffquery]'); if(qi) state.ffQuery=qi.value; loadFFSearch(); return; }
  if(a==="ffperson"){ var ppid=t.dataset.pid; state.ffPerson={pid:ppid,name:t.dataset.name}; state.ffPersonRows=null; state.ffPersonReactions=null; state.ffPersonErr=""; state.ffPersonLoading=true; window.scrollTo(0,0); render();
    DB.ffMine(ppid).then(function(data){ state.ffPersonLoading=false; state.ffPersonRows=data||[]; render(); })
      .catch(function(err){ state.ffPersonLoading=false; state.ffPersonErr=(err&&err.message)||"通信エラー"; state.ffPersonRows=[]; render(); });
    DB.ffReactions(ppid).then(function(rx){ state.ffPersonReactions=groupReactions(rx); render(); }).catch(function(){}); return; }
  if(a==="ffpersonback"){ state.ffPerson=null; render(); return; }
  if(a==="ffcat"){ var cc=t.dataset.cat; state.ffCategory=(state.ffCategory===cc?"":cc); render(); return; }
  if(a==="ffthisweek"){ state.ffWeek=mondayOf(); state.ffSaved=false; state.ffTab="mine"; prefillFFWeek(); loadFFEntrants(state.ffWeek); window.scrollTo(0,0); render(); return; }
  if(a==="ffcopylast"){ var lw=addDaysStr(state.ffWeek,-7); var prev=(state.ffMine||[]).filter(function(x){return x.week===lw;})[0];
    if(prev&&prev.goal){ state.ffGoal=prev.goal; render(); } else { alert("先週の目標が見つかりませんでした。"); } return; }
  if(a==="ffstamp"){ if(!state.playerName){ alert("先に名前を登録してね。"); return; }
    var spid=t.dataset.pid, swk=t.dataset.week, sem=t.dataset.emoji;
    var store=(spid===state.playerId)?state.ffMineReactions:state.ffPersonReactions;
    var already=((store&&store[swk])||[]).some(function(x){return x.emoji===sem&&x.from_pid===state.playerId;});
    if(already)return;
    DB.ffAddReaction({target_pid:spid,week:swk,from_pid:state.playerId,from_name:state.playerName,emoji:sem})
      .then(function(){ reloadReactions(spid); }).catch(function(err){ alert("エラー：\n"+((err&&err.message)||"通信エラー")); }); return; }
  if(a==="ffcomment"){ if(!state.playerName){ alert("先に名前を登録してね。"); return; }
    var cpid=t.dataset.pid, cwk=t.dataset.week; var txt=prompt("コメントを入力"); if(txt==null)return; txt=txt.trim(); if(!txt)return;
    DB.ffAddReaction({target_pid:cpid,week:cwk,from_pid:state.playerId,from_name:state.playerName,comment:txt})
      .then(function(){ reloadReactions(cpid); }).catch(function(err){ alert("エラー：\n"+((err&&err.message)||"通信エラー")); }); return; }
  if(a==="ffsave"){
    if(!state.playerName){ alert("先に名前を入れてね。"); return; }
    var gg=document.querySelector('[data-action=ffgoal]'), rr=document.querySelector('[data-action=ffreflect]');
    if(gg) state.ffGoal=gg.value; if(rr) state.ffReflection=rr.value;
    if(!state.ffGoal.trim() && !state.ffReflection.trim()){ alert("目標かふり返りを入力してね。"); return; }
    DB.ffUpsert({player_id:state.playerId,name:state.playerName,week:state.ffWeek,goal:state.ffGoal,reflection:state.ffReflection,category:state.ffCategory||null})
      .then(function(){ state.ffSaved=true; loadFFMine(); })
      .catch(function(err){ alert("保存でエラー：\n"+((err&&err.message)||"通信エラー")); });
    return;
  }
});

registerMember();
render();
</script>
</body>
</html>
